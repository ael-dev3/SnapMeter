name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapmeter-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:e2e

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.SNAPMETER_INGEST_SECRET != '' }}
    steps:
      - name: Explain skipped deployment
        if: env.CLOUDFLARE_READY != 'true'
        run: echo "Deployment skipped because the protected production Cloudflare secrets are not all configured."

      - name: Check out source
        if: env.CLOUDFLARE_READY == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        if: env.CLOUDFLARE_READY == 'true'
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 11.19.0
          run_install: false

      - name: Install Node.js
        if: env.CLOUDFLARE_READY == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        if: env.CLOUDFLARE_READY == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify signed Mini App release metadata
        if: env.CLOUDFLARE_READY == 'true'
        run: pnpm --filter @snapmeter/dashboard verify:miniapp:release

      - name: Apply production D1 migrations
        if: env.CLOUDFLARE_READY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @snapmeter/dashboard exec wrangler d1 migrations apply snapmeter-prod --remote

      - name: Deploy Worker and assets
        if: env.CLOUDFLARE_READY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SNAPMETER_INGEST_SECRET: ${{ secrets.SNAPMETER_INGEST_SECRET }}
        shell: bash
        run: |
          umask 077
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          printf 'SNAPMETER_INGEST_SECRET=%s\n' "$SNAPMETER_INGEST_SECRET" > "$secret_file"
          pnpm --filter @snapmeter/dashboard build
          pnpm --filter @snapmeter/dashboard exec wrangler deploy --secrets-file "$secret_file"
